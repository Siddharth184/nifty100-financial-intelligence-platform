# Screener Configuration & Threshold Definitions — Sprint 3

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE, low leverage, positive cash flows, and steady revenue growth."
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Low valuation P/E and P/B with manageable debt and decent dividend yield."
    filters:
      pe_max: 20.0
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High PAT and Revenue growth with controlled leverage."
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      de_max: 2.0

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield with positive free cash flows."
    filters:
      dividend_yield_min: 2.0
      fcf_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero debt, healthy ROE, and large top-line revenue."
    filters:
      de_max: 0.0
      roe_min: 12.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Improving revenue growth and positive latest cash flow."
    filters:
      revenue_cagr_5yr_min: 10.0
      fcf_min: 0.0

metric_mappings:
  roe_min: "roe"
  de_max: "debt_to_equity"
  fcf_min: "free_cash_flow"
  revenue_cagr_5yr_min: "cagr_sales_5yr"
  pat_cagr_5yr_min: "cagr_pat_5yr"
  opm_min: "opm"
  pe_max: "pe_ratio"
  pb_max: "pb_ratio"
  dividend_yield_min: "dividend_yield"
  icr_min: "interest_coverage"
  market_cap_min: "market_cap"
  net_profit_min: "net_profit"
  eps_cagr_min: "cagr_eps_5yr"
  asset_turnover_min: "asset_turnover"
  sales_min: "sales"
